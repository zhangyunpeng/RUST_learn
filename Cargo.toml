[package]
name = "learn"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
tokio-macros = { version = "0.2.0-alpha.6" }
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0.149"
serde_core = "1.0.228"
indexmap = { version = "2.13.0", features = ["serde"], optional = true }
url = "2.5.8"
xlsxwriter = "0.6.1"

[features]
default = []
preserve_order = []
