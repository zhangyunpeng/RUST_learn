[package]
name = "learn"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_core = "1.0.228"
indexmap = { version = "2.13.0", features = ["serde"], optional = true }
xlsxwriter = "0.6.1"
futures-util = "0.3"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio"] }
tower_governor = "0.8.0"
tower-http = { version = "0.7.0", features = ["trace"] }
serde = { version = "1.0.228", features = ["derive"] }
mini-redis = "0.4"
bytes = "1"

[features]
default = []
preserve_order = []
